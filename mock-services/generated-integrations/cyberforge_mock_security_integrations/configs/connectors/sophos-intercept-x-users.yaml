version: '1.0'
name: sophos-intercept-x-users
base_url: http://127.0.0.1:9001
auth:
  type: bearer
  secret_ref: SOPHOS_BEARER_TOKEN
endpoint:
  method: GET
  path: /api/users
  query_params: {}
response:
  format: yaml
  records_path: items
pagination:
  type: page
  page_param: page
  start_page: 1
  limit_param: limit
  page_size: 20
schedule:
  every_minutes: 15
incremental:
  enabled: true
  type: timestamp
  request_param: since
  source_field: lastLogin
mapping:
  entity: user
  fields:
    id: id
    name: name
    email: email
    status: status
    last_login: lastLogin
enabled: false

version: "1.0"

name: sophos-intercept-x-mock

base_url: http://127.0.0.1:9001

auth:
  type: none

endpoint:
  method: GET
  path: /sophos/events
  query_params: {}

response:
  format: json
  records_path: items

pagination:
  type: page
  page_param: page
  start_page: 1
  limit_param: limit
  page_size: 20
  has_more_path: has_more

schedule:
  every_minutes: 15

mapping:
  entity: event

  fields:
    id: id
    type: type
    severity: severity
    timestamp: raisedAt
    description: description

enabled: false

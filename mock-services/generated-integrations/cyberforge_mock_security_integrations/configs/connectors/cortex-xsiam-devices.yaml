version: '1.0'
name: cortex-xsiam-devices
base_url: http://127.0.0.1:9001
auth:
  type: api_key
  header: x-xdr-auth-id
  secret_ref: CORTEX_API_KEY
endpoint:
  method: GET
  path: /api/devices
  query_params: {}
response:
  format: json
  records_path: reply.endpoints
pagination:
  type: page
  page_param: page
  start_page: 1
  limit_param: limit
  page_size: 20
schedule:
  every_minutes: 15
incremental:
  enabled: true
  type: timestamp
  request_param: since
  source_field: last_seen_time
mapping:
  entity: device
  fields:
    id: endpoint_id
    hostname: endpoint_name
    ip: primary_ip
    os: os_type
    owner: assigned_analyst
    last_seen: last_seen_time
enabled: false

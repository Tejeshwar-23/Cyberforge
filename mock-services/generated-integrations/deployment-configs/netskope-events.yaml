version: '1.0'
name: netskope-events
base_url: http://127.0.0.1:9001
auth:
  type: api_key
  header: Netskope-Api-Token
  secret_ref: NETSKOPE_API_TOKEN
endpoint:
  method: GET
  path: /mock/netskope/events
  query_params: {}
response:
  format: json
  records_path: data.alerts
pagination:
  type: page
  page_param: page
  start_page: 1
  limit_param: limit
  page_size: 20
schedule:
  every_minutes: 15
incremental:
  enabled: true
  type: timestamp
  request_param: since
  source_field: alert_timestamp
mapping:
  entity: event
  fields:
    id: alert_id
    type: alert_type
    severity: severity_name
    timestamp: alert_timestamp
    description: alert_narrative
enabled: false

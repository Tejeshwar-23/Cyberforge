version: '1.0'
name: wiz-devices
base_url: http://127.0.0.1:9001
auth:
  type: bearer
  secret_ref: WIZ_BEARER_TOKEN
endpoint:
  method: GET
  path: /api/devices
  query_params: {}
response:
  format: yaml
  records_path: data.resources.nodes
pagination:
  type: page
  page_param: page
  start_page: 1
  limit_param: limit
  page_size: 20
schedule:
  every_minutes: 15
incremental:
  enabled: true
  type: timestamp
  request_param: since
  source_field: scannedAt
mapping:
  entity: device
  fields:
    id: resourceId
    hostname: resourceName
    ip: primaryNetworkAddress
    os: operatingSystem
    owner: cloudAccountOwner
    last_seen: scannedAt
enabled: false

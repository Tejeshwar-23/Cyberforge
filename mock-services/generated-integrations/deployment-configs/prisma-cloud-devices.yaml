version: '1.0'
name: prisma-cloud-devices
base_url: http://127.0.0.1:9001
auth:
  type: custom_headers
  secret_headers:
    x-redlock-auth: PRISMA_ACCESS_KEY
endpoint:
  method: GET
  path: /mock/prisma-cloud/devices
  query_params: {}
response:
  format: json
  records_path: assets
pagination:
  type: offset
  offset_param: offset
  limit_param: limit
  page_size: 20
schedule:
  every_minutes: 15
incremental:
  enabled: true
  type: timestamp
  request_param: since
  source_field: discoveryTime
mapping:
  entity: device
  fields:
    id: assetId
    hostname: assetName
    ip: publicIpAddress
    os: osVersion
    owner: accountGroup
    last_seen: discoveryTime
enabled: false

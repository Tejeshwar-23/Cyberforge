version: '1.0'
name: crowdstrike-cloud-security-events
base_url: http://127.0.0.1:9001
auth:
  type: bearer
  secret_ref: CROWDSTRIKE_BEARER_TOKEN
endpoint:
  method: GET
  path: /api/events
  query_params: {}
response:
  format: yaml
  records_path: resources
pagination:
  type: offset
  offset_param: offset
  limit_param: limit
  page_size: 20
schedule:
  every_minutes: 15
incremental:
  enabled: true
  type: timestamp
  request_param: since
  source_field: created_timestamp
mapping:
  entity: event
  fields:
    id: detection_id
    type: tactic
    severity: severity_name
    timestamp: created_timestamp
    description: narrative
enabled: false

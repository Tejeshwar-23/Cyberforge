version: '1.0'
name: cortex-xsiam-devices
description: null
base_url: http://127.0.0.1:9001/
auth:
  type: api_key
  secret_ref: CORTEX_API_KEY
  header: x-xdr-auth-id
endpoint:
  method: GET
  path: /mock/cortex-xsiam/devices
  query_params: {}
  headers: {}
response:
  format: json
  records_path: reply.endpoints
pagination:
  type: page
  page_param: page
  start_page: 1
  offset_param: null
  limit_param: limit
  page_size: 20
  has_more_path: null
  cursor_param: null
  cursor_response_path: null
  next_link_path: null
schedule:
  every_minutes: 15
incremental:
  enabled: true
  type: timestamp
  request_param: since
  source_field: last_seen_time
mapping:
  entity: device
  fields:
    id: endpoint_id
    hostname: endpoint_name
    ip: primary_ip
    os: os_type
    owner: assigned_analyst
    last_seen: last_seen_time
  constants: {}
  date_fields: []
enabled: false

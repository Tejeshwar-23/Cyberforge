version: '1.0'
name: fortinet-fortigate-devices
base_url: http://127.0.0.1:9001
auth:
  type: bearer
  secret_ref: FORTIGATE_API_TOKEN
endpoint:
  method: GET
  path: /mock/fortinet-fortigate/devices
  query_params: {}
response:
  format: xml
  records_path: results.device_entry
pagination:
  type: offset
  offset_param: offset
  limit_param: limit
  page_size: 20
schedule:
  every_minutes: 15
incremental:
  enabled: true
  type: timestamp
  request_param: since
  source_field: last_seen_time
mapping:
  entity: device
  fields:
    id: dev_id
    hostname: dev_name
    ip: dev_ip
    os: os_family
    owner: assigned_user
    last_seen: last_seen_time
enabled: false

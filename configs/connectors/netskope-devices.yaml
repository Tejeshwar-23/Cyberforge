version: '1.0'
name: netskope-devices
base_url: http://127.0.0.1:9001
auth:
  type: api_key
  header: Netskope-Api-Token
  secret_ref: NETSKOPE_API_TOKEN
endpoint:
  method: GET
  path: /mock/netskope/devices
  query_params: {}
response:
  format: json
  records_path: data.devices
pagination:
  type: offset
  offset_param: offset
  limit_param: limit
  page_size: 20
schedule:
  every_minutes: 15
incremental:
  enabled: true
  type: timestamp
  request_param: since
  source_field: last_event_time
mapping:
  entity: device
  fields:
    id: client_id
    hostname: device_name
    ip: egress_ip
    os: operating_system
    owner: registered_user
    last_seen: last_event_time
enabled: false

version: "1.0"

name: fortigate-firewall-mock

base_url: http://127.0.0.1:9001

auth:
  type: bearer
  secret_ref: FORTIGATE_MOCK_TOKEN

endpoint:
  method: GET
  path: /fortigate/logs
  query_params: {}

response:
  format: json
  records_path: results

pagination:
  type: offset
  offset_param: offset
  limit_param: limit
  page_size: 2

schedule:
  every_minutes: 15

incremental:
  enabled: true
  type: timestamp
  request_param: since
  source_field: eventtime

mapping:
  entity: event

  fields:
    id: logid
    type: type
    severity: level
    timestamp: eventtime
    description: msg

enabled: false

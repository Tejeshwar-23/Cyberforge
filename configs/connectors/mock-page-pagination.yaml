version: "1.0"

name: mock-page-pagination-platform

base_url: http://127.0.0.1:9001

auth:
  type: none

endpoint:
  method: GET
  path: /page-events
  query_params: {}

response:
  format: json
  records_path: events

pagination:
  type: page
  page_param: page
  start_page: 1
  limit_param: limit
  page_size: 2

schedule:
  every_minutes: 15

mapping:
  entity: event

  fields:
    id: eventId
    severity: priority
    timestamp: createdAt
    description: message

  constants:
    type: security_event

enabled: true

version: "1.0"

name: mock-security-platform
description: Local CyberForge integration test source

base_url: http://127.0.0.1:9001

auth:
  type: none

endpoint:
  method: GET
  path: /events
  query_params: {}

response:
  format: json
  records_path: events

pagination:
  type: none

schedule:
  every_minutes: 15

mapping:
  entity: event

  fields:
    id: eventId
    severity: priority
    timestamp: createdAt
    description: message

  constants:
    type: security_event

enabled: true

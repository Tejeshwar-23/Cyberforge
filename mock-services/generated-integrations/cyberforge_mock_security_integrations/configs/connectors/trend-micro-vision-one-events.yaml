version: '1.0'
name: trend-micro-vision-one-events
base_url: http://127.0.0.1:9001
auth:
  type: bearer
  secret_ref: TRENDMICRO_BEARER_TOKEN
endpoint:
  method: GET
  path: /api/events
  query_params: {}
response:
  format: json
  records_path: response.data
pagination:
  type: offset
  offset_param: offset
  limit_param: limit
  page_size: 20
schedule:
  every_minutes: 15
incremental:
  enabled: true
  type: timestamp
  request_param: since
  source_field: createdDateTime
mapping:
  entity: event
  fields:
    id: workbenchId
    type: incidentType
    severity: riskLevel
    timestamp: createdDateTime
    description: summary
enabled: false

version: "1.0"

name: elastic-security-mock

base_url: http://127.0.0.1:9001

auth:
  type: basic
  username_ref: ELASTIC_MOCK_USERNAME
  password_ref: ELASTIC_MOCK_PASSWORD

endpoint:
  method: GET
  path: /elastic/security/alerts
  query_params: {}

response:
  format: json
  records_path: hits.hits

pagination:
  type: page
  page_param: page
  start_page: 1
  limit_param: limit
  page_size: 2
  has_more_path: has_more

schedule:
  every_minutes: 15

incremental:
  enabled: true
  type: timestamp
  request_param: since
  source_field: _source.@timestamp

mapping:
  entity: event

  fields:
    id: _id
    type: _source.event.kind
    severity: _source.kibana.alert.severity
    timestamp: _source.@timestamp
    description: _source.kibana.alert.reason

enabled: false

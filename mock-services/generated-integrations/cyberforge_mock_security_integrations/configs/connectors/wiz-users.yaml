version: '1.0'
name: wiz-users
base_url: http://127.0.0.1:9001
auth:
  type: bearer
  secret_ref: WIZ_BEARER_TOKEN
endpoint:
  method: GET
  path: /api/users
  query_params: {}
response:
  format: json
  records_path: data.users.nodes
pagination:
  type: offset
  offset_param: offset
  limit_param: limit
  page_size: 20
schedule:
  every_minutes: 15
incremental:
  enabled: true
  type: timestamp
  request_param: since
  source_field: lastLogin
mapping:
  entity: user
  fields:
    id: id
    name: name
    email: email
    status: status
    last_login: lastLogin
enabled: false

version: '1.0'
name: cortex-xsiam-events
base_url: http://127.0.0.1:9001
auth:
  type: api_key
  header: x-xdr-auth-id
  secret_ref: CORTEX_API_KEY
endpoint:
  method: GET
  path: /api/events
  query_params: {}
response:
  format: json
  records_path: reply.alerts
pagination:
  type: offset
  offset_param: offset
  limit_param: limit
  page_size: 20
schedule:
  every_minutes: 15
incremental:
  enabled: true
  type: timestamp
  request_param: since
  source_field: creation_time
mapping:
  entity: event
  fields:
    id: alert_id
    type: category
    severity: severity_level
    timestamp: creation_time
    description: alert_name
enabled: false

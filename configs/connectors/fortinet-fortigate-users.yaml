version: '1.0'
name: fortinet-fortigate-users
base_url: http://127.0.0.1:9001
auth:
  type: bearer
  secret_ref: FORTIGATE_API_TOKEN
endpoint:
  method: GET
  path: /mock/fortinet-fortigate/users
  query_params: {}
response:
  format: xml
  records_path: results.user_entry
pagination:
  type: page
  page_param: page
  start_page: 1
  limit_param: limit
  page_size: 20
schedule:
  every_minutes: 15
incremental:
  enabled: true
  type: timestamp
  request_param: since
  source_field: last_auth_time
mapping:
  entity: user
  fields:
    id: uid
    name: username
    email: contact_email
    status: auth_state
    last_login: last_auth_time
enabled: false

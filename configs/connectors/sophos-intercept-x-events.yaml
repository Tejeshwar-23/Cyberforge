version: '1.0'
name: sophos-intercept-x-events
base_url: http://127.0.0.1:9001
auth:
  type: bearer
  secret_ref: SOPHOS_BEARER_TOKEN
endpoint:
  method: GET
  path: /mock/sophos-intercept-x/events
  query_params: {}
response:
  format: json
  records_path: items
pagination:
  type: page
  page_param: page
  start_page: 1
  limit_param: limit
  page_size: 20
schedule:
  every_minutes: 15
incremental:
  enabled: true
  type: timestamp
  request_param: since
  source_field: raisedAt
mapping:
  entity: event
  fields:
    id: id
    type: type
    severity: severity
    timestamp: raisedAt
    description: description
enabled: true

version: '1.0'
name: prisma-cloud-users
base_url: http://127.0.0.1:9001
auth:
  type: custom_headers
  secret_headers:
    x-redlock-auth: PRISMA_ACCESS_KEY
endpoint:
  method: GET
  path: /api/users
  query_params: {}
response:
  format: yaml
  records_path: users
pagination:
  type: page
  page_param: page
  start_page: 1
  limit_param: limit
  page_size: 20
schedule:
  every_minutes: 15
incremental:
  enabled: true
  type: timestamp
  request_param: since
  source_field: lastLoginTime
mapping:
  entity: user
  fields:
    id: username_id
    name: displayName
    email: userEmail
    status: activeStatus
    last_login: lastLoginTime
enabled: false
